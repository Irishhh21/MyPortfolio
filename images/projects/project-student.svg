<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="student-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9F7" />
      <stop offset="100%" stop-color="#E8EFEA" />
    </linearGradient>
    <filter id="student-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E232A" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#student-bg)" />

  <g transform="translate(60, 40)" filter="url(#student-shadow)">
    <rect width="480" height="280" rx="14" fill="#FFFFFF" stroke="#E2E6E1" stroke-width="1.5" />
    <path d="M0 14 Q0 0 14 0 L466 0 Q480 0 480 14 L480 40 L0 40 Z" fill="#F4F6F4" />
    <circle cx="24" cy="20" r="5" fill="#CBD5E1" />
    <circle cx="42" cy="20" r="5" fill="#94A3B8" />
    <circle cx="60" cy="20" r="5" fill="#769680" />
    <text x="240" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2D3748">Student Web Project Template</text>

    <!-- Content Area: Dashed placeholder -->
    <rect x="35" y="60" width="410" height="195" rx="10" fill="#FAFAF8" stroke="#CBD8CF" stroke-width="2" stroke-dasharray="6 6" />
    
    <!-- Center Icon & Labels in Sage & Charcoal -->
    <circle cx="240" cy="120" r="30" fill="#EBF3ED" />
    <path d="M230 115 L240 105 L250 115 M240 107 L240 135" stroke="#769680" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="240" y="175" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1E232A">Your Next Project Here</text>
    <text x="240" y="198" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#556070">Replace with your coursework, hackathon project, or personal web app</text>

    <rect x="180" y="215" width="120" height="26" rx="13" fill="#769680" />
    <text x="240" y="232" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Customizable Card</text>
  </g>
</svg>
